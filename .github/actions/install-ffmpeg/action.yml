name: Install ffmpeg
description: >-
  Installs ffmpeg from apt without depending on the mirror for packages it has
  already fetched. `apt-get update` and `apt-get install` each run in a bounded
  retry loop (three attempts under `timeout`), and the downloaded .deb files are
  cached, keyed on the runner image's OS and the candidate ffmpeg version, so a
  stuck mirror fails fast and a cache hit never downloads from it. The cache is
  saved right after the install, before any later step can touch it. The caller
  sets the step's own timeout-minutes as the outer bound: worst case is 3 x 30 s
  for update plus 3 x 60 s for install.
runs:
  using: composite
  steps:
    # ImageOS is set in the runner's environment, which a composite action's
    # `env` context does not see, so it is read in a shell and passed on. The
    # image OS (not the weekly image version) keeps the key stable; an Ubuntu
    # bump falls back to older debs and apt fetches only what changed.
    - id: update
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/apt-retry.sh"
        apt_retry 30 update
        # The candidate version goes in the cache key, so a new Ubuntu ffmpeg
        # update saves a fresh entry instead of leaving the first one frozen.
        version="$(apt-cache policy ffmpeg | awk '/Candidate:/ {print $2}' | tr -c 'A-Za-z0-9._+~\n-' '_')"
        echo "os=${ImageOS:?runner did not set ImageOS}" >> "$GITHUB_OUTPUT"
        echo "version=${version:?apt-cache policy reported no ffmpeg candidate}" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/apt-archives
        key: apt-debs-${{ runner.os }}-${{ steps.update.outputs.os }}-ffmpeg-${{ steps.update.outputs.version }}
        restore-keys: |
          apt-debs-${{ runner.os }}-${{ steps.update.outputs.os }}-ffmpeg-
          apt-debs-${{ runner.os }}-
    - shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/apt-retry.sh"
        mkdir -p "$archives/partial"
        apt_retry 60 install -y --no-install-recommends ffmpeg
        # apt ran as root; give the directory back so the cache can save it.
        sudo chown -R "$(id -u):$(id -g)" "$archives"
    # Saved here, before any later step of the job can write to the directory.
    # An exact-key hit is already stored (entries are immutable), so skip it.
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.restore.outputs.cache-primary-key }}
