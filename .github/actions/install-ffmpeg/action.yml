name: Install ffmpeg
description: >-
  Installs ffmpeg from apt with bounded network waits. Acquire::Retries retries a
  failed fetch and the Timeout options drop a stalled connection, so a stuck
  mirror fails fast instead of holding the runner to the job's timeout. The
  caller sets the step's own timeout-minutes as the outer bound.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        sudo apt-get "${apt_opts[@]}" update
        sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg
