name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs are based on sibling branches, not main, and
  # still need CI.
  pull_request:

permissions:
  contents: read

# A new push to a PR branch cancels that branch's superseded run; runs on main
# always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra eval
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      # mypy checks against the interpreter it runs on, so the 3.10 floor catches
      # stdlib names newer than 3.10. Setting mypy's python_version instead breaks
      # on the 3.12 environment's numpy stubs, which use 3.12-only syntax.
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra eval
      - run: uv run --no-sync mypy . --ignore-missing-imports

  test:
    name: Default Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite takes seconds; a loop pin that stops stopping should not run for hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor WXDU's deploy can run on; 3.12 is the pinned
        # interpreter in .python-version.
        python-version: ["3.10", "3.12"]
    env:
      # Overrides .python-version for every uv command in the job, so the 3.10
      # leg cannot silently fall back to 3.12.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra eval
      # Plain pytest: testpaths and addopts in pyproject.toml decide what runs.
      - run: uv run --no-sync pytest

  ffmpeg:
    name: ffmpeg Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The pinned interpreter, stated like the test job's so it cannot drift.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra eval
      - run: uv run --no-sync pytest -m "ffmpeg"

  olaf:
    name: Olaf Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      # The pinned Olaf commit and Zig version (README, "Local recognizer").
      OLAF_COMMIT: a98d8c03cfd447011d402718ca2d10b2bb467eb0
      ZIG_VERSION: 0.16.0
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - id: olaf-cache
        uses: actions/cache@v4
        with:
          path: .olaf-build/zig-out/bin/olaf
          key: olaf-${{ runner.os }}-${{ env.OLAF_COMMIT }}-zig-${{ env.ZIG_VERSION }}
      - if: steps.olaf-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # A dot-directory: Olaf ships Python files of its own, and the S3 import scan
      # skips dot-directories.
      - if: steps.olaf-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: JorenSix/Olaf
          ref: ${{ env.OLAF_COMMIT }}
          path: .olaf-build
      - if: steps.olaf-cache.outputs.cache-hit != 'true'
        working-directory: .olaf-build
        run: zig build -Doptimize=ReleaseFast
      - run: echo "STREAM_SLEUTH_OLAF_BIN=$GITHUB_WORKSPACE/.olaf-build/zig-out/bin/olaf" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra eval
      - run: uv run --no-sync pytest -m "olaf"

  marker-sync:
    name: CI Marker Sync
    uses: WXYC/wxyc-etl/.github/workflows/check-ci-marker-sync.yml@gha/v1
    with:
      repo-path: "."
      workflows-dir: ".github/workflows"
      tests-dir: "tests"
      wxyc-etl-ref: gha/v1
